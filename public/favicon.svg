<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5568d3;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Docker whale body -->
  <path d="M 15 60 Q 15 50 25 50 L 75 50 Q 85 50 85 60 L 85 70 Q 85 80 75 80 L 25 80 Q 15 80 15 70 Z" fill="url(#grad1)"/>

  <!-- Containers on top of whale -->
  <rect x="20" y="35" width="12" height="12" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="35" y="35" width="12" height="12" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="50" y="35" width="12" height="12" rx="2" fill="#ffffff" opacity="0.9"/>
  <rect x="65" y="35" width="12" height="12" rx="2" fill="#ffffff" opacity="0.9"/>

  <!-- Container details (lines) -->
  <line x1="22" y1="38" x2="30" y2="38" stroke="#667eea" stroke-width="1"/>
  <line x1="22" y1="41" x2="30" y2="41" stroke="#667eea" stroke-width="1"/>
  <line x1="37" y1="38" x2="45" y2="38" stroke="#667eea" stroke-width="1"/>
  <line x1="37" y1="41" x2="45" y2="41" stroke="#667eea" stroke-width="1"/>
  <line x1="52" y1="38" x2="60" y2="38" stroke="#667eea" stroke-width="1"/>
  <line x1="52" y1="41" x2="60" y2="41" stroke="#667eea" stroke-width="1"/>
  <line x1="67" y1="38" x2="75" y2="38" stroke="#667eea" stroke-width="1"/>
  <line x1="67" y1="41" x2="75" y2="41" stroke="#667eea" stroke-width="1"/>

  <!-- Whale eye -->
  <circle cx="72" cy="62" r="3" fill="#ffffff"/>
  <circle cx="73" cy="62" r="1.5" fill="#2c3e50"/>

  <!-- Water waves -->
  <path d="M 10 82 Q 20 78 30 82 Q 40 86 50 82 Q 60 78 70 82 Q 80 86 90 82"
        stroke="#667eea" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M 10 87 Q 20 83 30 87 Q 40 91 50 87 Q 60 83 70 87 Q 80 91 90 87"
        stroke="#667eea" stroke-width="2" fill="none" opacity="0.3"/>
</svg>
